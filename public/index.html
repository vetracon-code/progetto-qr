<!DOCTYPE html>
<html>
<head>
    <title>PWA Admin - Attiva Notifiche</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        button { padding: 20px; font-size: 18px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Configurazione Notifiche</h1>
    <p>Clicca il tasto sotto per ricevere le segnalazioni su questo dispositivo.</p>
    <button id="subscribeBtn">ATTIVA NOTIFICHE PUSH</button>

    <script>
        const subscribeBtn = document.getElementById('subscribeBtn');

        // Funzione per convertire la chiave VAPID
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
            return outputArray;
        }

        subscribeBtn.addEventListener('click', async () => {
            const registration = await navigator.serviceWorker.register('/service-worker.js');
            const response = await fetch('/api/push/public-key');
            const { publicKey } = await response.json();

            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(publicKey)
            });

            // Invia la sottoscrizione al tuo server
            await fetch('/api/push/subscribe', {
                method: 'POST',
                body: JSON.stringify({
                    subscription: subscription,
                    role: 'owner', // Ti registriamo come proprietario
                    target_id: 'all'
                }),
                headers: { 'Content-Type': 'application/json' }
            });

            alert('Dispositivo registrato con successo!');
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
</body>
</html>
