<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Segnalazioni QR</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/564/564619.png">
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 320px; }
        button { background: #007AFF; color: white; border: none; padding: 15px 25px; border-radius: 12px; font-weight: 600; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Centro Notifiche</h1>
        <p>Attiva le notifiche per ricevere le segnalazioni dei QR.</p>
        <button id="subscribeBtn">ATTIVA NOTIFICHE</button>
    </div>

    <script>
        const publicKey = "BDRaXVWmCl7kQJwYu2HhNxAkLc6OKWdiQzngXVocjiRIX2HCYwxTGkS_YNS60NiRzS6qFY0sxO0cBFu-WwBimIE";

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
            return outputArray;
        }

        document.getElementById('subscribeBtn').addEventListener('click', async () => {
            const reg = await navigator.serviceWorker.register('/service-worker.js');
            await navigator.serviceWorker.ready;
            const subscription = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(publicKey)
            });
            await fetch('/api/push/subscribe', {
                method: 'POST',
                body: JSON.stringify({ subscription }),
                headers: { 'Content-Type': 'application/json' }
            });
            alert('✅ Notifiche Attivate!');
        });
    </script>
</body>
</html>
